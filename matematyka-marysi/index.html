<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#160d38">
<link rel="manifest" href="manifest.json">
<title>Soroban Marysi</title>
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <div class="brand">🧮 Soroban Marysi</div>
      <div class="small">liczymy do 10</div>
    </div>
    <div class="topactions">
      <div class="stars" id="stars">⭐ 0</div>
      <button class="gear" onclick="openSettings()" aria-label="Ustawienia">⚙️</button>
    </div>
  </header>

  <main>
    <div class="modes" role="tablist">
      <button id="mode-number" onclick="setMode('number')">Liczby</button>
      <button id="mode-add" class="active" onclick="setMode('add')">Dodawanie</button>
      <button id="mode-sub" onclick="setMode('sub')">Odejmowanie</button>
    </div>

    <section class="trainer">
      <div class="trainerHead">
        <div>
          <div class="eyebrow" id="modeTitle">Dodawanie do 10</div>
          <div class="instruction">Posłuchaj i przesuń koraliki</div>
        </div>
        <button class="listen" onclick="repeatInstruction()" aria-label="Powtórz polecenie">🔊</button>
      </div>

      <div id="sorobanMount"></div>

      <div class="feedback" id="feedback"></div>

      <div class="controls">
        <button class="secondary" onclick="resetToStart()">↩ Zacznij od początku</button>
        <button class="primary" onclick="checkTask()">Gotowe ✓</button>
      </div>

      <div class="session">
        <div class="dots" id="dots"></div>
        <div id="sessionText">1 z 10</div>
      </div>
    </section>

    <section class="tip">
      <button onclick="showHelp()">💡 Pomoc</button>
      <p id="tipText">Lektor poda polecenie. Na ekranie nie pokazujemy działania — Marysia liczy tylko na sorobanie.</p>
    </section>
  </main>
</div>

<div class="sheet" id="settingsSheet" onclick="sheetBackdrop(event)">
  <div class="sheetBox">
    <div class="sheetHandle"></div>
    <div class="sheetTitle">
      <h2>Ustawienia rodzica</h2>
      <button onclick="closeSettings()">✕</button>
    </div>

    <div class="settingRow">
      <div><b>🔊 Lektor</b><small>Naturalny polski głos z telefonu.</small></div>
      <input id="voiceToggle" type="checkbox" checked onchange="saveVoiceSetting()">
    </div>

    <label class="label" for="voiceSelect">Głos</label>
    <select id="voiceSelect" onchange="selectVoice(this.value)">
      <option value="">Automatycznie — najlepszy polski</option>
    </select>
    <button class="testVoice" onclick="testVoice()">▶ Posłuchaj</button>

    <div class="stats">
      <div><b id="correctStat">0</b><span>poprawnych</span></div>
      <div><b id="totalStat">0</b><span>zadań</span></div>
      <div><b id="accuracyStat">0%</b><span>skuteczność</span></div>
    </div>

    <button class="danger" onclick="resetProgress()">Wyzeruj postępy</button>
  </div>
</div>

<script src="app.js?v=4"></script>
</body>
</html>
