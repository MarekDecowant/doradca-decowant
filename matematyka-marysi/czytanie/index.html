<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6c4bd8"><title>Marysia czyta sylabami</title>
<style>
:root{font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;color:#272244;background:#f4f0ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 10%,#fff7b2 0 8%,transparent 26%),radial-gradient(circle at 90% 20%,#d9f8ff 0 8%,transparent 27%),linear-gradient(155deg,#fbf8ff,#eee9ff)}button{font:inherit}.app{max-width:760px;margin:auto;padding:18px 16px 40px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:clamp(21px,5vw,34px);font-weight:900;color:#5637bd}.stars{background:#fff;border:2px solid #e0d7ff;border-radius:999px;padding:9px 14px;font-weight:900;box-shadow:0 5px 0 #d9cdfb}.card{margin-top:16px;background:rgba(255,255,255,.94);border:3px solid #ddd2ff;border-radius:28px;padding:clamp(18px,5vw,32px);box-shadow:0 12px 30px #6d50bb20}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:24px}.level{border:0;border-radius:13px;padding:10px 4px;background:#ebe7f7;color:#655c80;font-weight:900;cursor:pointer}.level.active{background:#6546d4;color:#fff;box-shadow:0 4px 0 #3e2799}.prompt{text-align:center;color:#756b8f;font-weight:800;margin:4px 0 10px}.word{text-align:center;font-size:clamp(44px,12vw,76px);font-weight:950;letter-spacing:.02em;min-height:100px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap}.syl{padding:0 .03em}.syl:nth-child(odd){color:#e14b78}.syl:nth-child(even){color:#287dc7}.sentence{font-size:clamp(34px,9vw,60px);gap:.28em}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.mainbtn{border:0;border-radius:18px;padding:16px 10px;font-weight:900;font-size:18px;cursor:pointer;box-shadow:0 5px 0}.hear{background:#ffe064;color:#4c3d00;box-shadow:0 5px 0 #d4ad22}.read{background:#52c99a;color:#073d2b;box-shadow:0 5px 0 #279b70}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px}.choice{min-height:63px;border:3px solid #d8d0f1;border-radius:17px;background:#fff;color:#30284f;font-size:23px;font-weight:900;cursor:pointer}.choice.good{background:#c8f6df;border-color:#42bb84}.choice.bad{background:#ffd7df;border-color:#e85c7c}.msg{text-align:center;height:30px;margin:15px 0 0;font-weight:900;font-size:19px}.progress{height:13px;background:#e9e5f4;border-radius:99px;overflow:hidden;margin-top:18px}.bar{height:100%;background:linear-gradient(90deg,#8062e7,#e9578c);transition:width .3s}.foot{text-align:center;color:#756b8f;font-weight:700;margin-top:14px}.celebrate{animation:pop .45s}@keyframes pop{50%{transform:scale(1.08)}}@media(max-width:480px){.levels{grid-template-columns:repeat(2,1fr)}.actions{grid-template-columns:1fr}.choice{font-size:20px}.card{border-radius:22px}}
</style></head><body><main class="app"><div class="top"><div class="brand">Czytam z Marysią 📚</div><div class="stars" aria-live="polite">⭐ <span id="score">0</span></div></div><section class="card"><nav class="levels" aria-label="Poziomy"><button class="level active" data-l="0">1 · krótkie</button><button class="level" data-l="1">2 · sylaby</button><button class="level" data-l="2">3 · dłuższe</button><button class="level" data-l="3">4 · zdania</button></nav><p class="prompt" id="prompt">Przeczytaj słowo</p><div class="word" id="word"></div><div class="actions"><button class="mainbtn hear" id="hear">🔊 Posłuchaj</button><button class="mainbtn read" id="read">✓ Umiem przeczytać</button></div><div class="choices" id="choices"></div><div class="msg" id="msg" aria-live="polite"></div><div class="progress"><div class="bar" id="bar"></div></div><div class="foot" id="foot"></div></section></main>
<script>
const levels=[
[{w:'dom',s:['dom']},{w:'dym',s:['dym']},{w:'puch',s:['puch']},{w:'pył',s:['pył']},{w:'dach',s:['dach']},{w:'pąk',s:['pąk']},{w:'huk',s:['huk']},{w:'hak',s:['hak']},{w:'hol',s:['hol']},{w:'lot',s:['lot']},{w:'kąt',s:['kąt']},{w:'pan',s:['pan']},{w:'łeb',s:['łeb']},{w:'duch',s:['duch']},{w:'mech',s:['mech']},{w:'mak',s:['mak']},{w:'lew',s:['lew']},{w:'lok',s:['lok']},{w:'gil',s:['gil']},{w:'dąb',s:['dąb']},{w:'paw',s:['paw']},{w:'wół',s:['wół']},{w:'gol',s:['gol']},{w:'pech',s:['pech']},{w:'tak',s:['tak']},{w:'nie',s:['nie']},{w:'łyk',s:['łyk']},{w:'byk',s:['byk']},{w:'kup',s:['kup']},{w:'wuj',s:['wuj']},{w:'bąk',s:['bąk']},{w:'bal',s:['bal']},{w:'łuk',s:['łuk']},{w:'maj',s:['maj']},{w:'pot',s:['pot']},{w:'loch',s:['loch']},{w:'koń',s:['koń']},{w:'miś',s:['miś']},{w:'ćma',s:['ćma']},{w:'śpi',s:['śpi']}],
[{w:'opona',s:['o','po','na']},{w:'ulewa',s:['u','le','wa']},{w:'oliwa',s:['o','li','wa']},{w:'aleja',s:['a','le','ja']},{w:'uchyla',s:['u','chy','la']},{w:'ucina',s:['u','ci','na']},{w:'kakao',s:['ka','ka','o']},{w:'koala',s:['ko','a','la']},{w:'łakomy',s:['ła','ko','my']},{w:'holuje',s:['ho','lu','je']},{w:'tapeta',s:['ta','pe','ta']},{w:'gaduła',s:['ga','du','ła']},{w:'piłuje',s:['pi','łu','je']},{w:'podaje',s:['po','da','je']}],
[{w:'motyka',s:['mo','ty','ka']},{w:'gajowy',s:['ga','jo','wy']},{w:'daleko',s:['da','le','ko']},{w:'minuta',s:['mi','nu','ta']},{w:'maluje',s:['ma','lu','je']},{w:'dolina',s:['do','li','na']},{w:'wagony',s:['wa','go','ny']},{w:'luneta',s:['lu','ne','ta']},{w:'leniwy',s:['le','ni','wy']},{w:'kanapa',s:['ka','na','pa']},{w:'kimono',s:['ki','mo','no']},{w:'pomaga',s:['po','ma','ga']},{w:'kupuje',s:['ku','pu','je']},{w:'jagody',s:['ja','go','dy']},{w:'maliny',s:['ma','li','ny']},{w:'papuga',s:['pa','pu','ga']},{w:'domino',s:['do','mi','no']},{w:'komoda',s:['ko','mo','da']},{w:'bogaty',s:['bo','ga','ty']},{w:'topola',s:['to','po','la']},{w:'antena',s:['an','te','na']},{w:'ambona',s:['am','bo','na']},{w:'pakuje',s:['pa','ku','je']},{w:'łopata',s:['ło','pa','ta']},{w:'ląduje',s:['lą','du','je']}],
[{w:'Miś śpi.',s:['Miś','śpi.']},{w:'Tata maluje.',s:['Ta-ta','ma-lu-je.']},{w:'Mama pakuje.',s:['Ma-ma','pa-ku-je.']},{w:'Wuj kupuje.',s:['Wuj','ku-pu-je.']},{w:'Koala je.',s:['Ko-a-la','je.']},{w:'Papuga gada.',s:['Pa-pu-ga','ga-da.']},{w:'Pies pomaga.',s:['Pies','po-ma-ga.']},{w:'Marysia czyta.',s:['Ma-ry-sia','czy-ta.']},{w:'Kuba podaje.',s:['Ku-ba','po-da-je.']},{w:'Pociąg jedzie.',s:['Po-ciąg','je-dzie.']},{w:'Balon leci.',s:['Ba-lon','le-ci.']},{w:'Kot pije.',s:['Kot','pi-je.']}]
];
let level=0,index=0,score=0,answered=false;const $=id=>document.getElementById(id);function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function item(){return levels[level][index%levels[level].length]}function render(){answered=false;const x=item();$('prompt').textContent=level===3?'Przeczytaj zdanie':'Przeczytaj słowo sylabami';$('word').className='word'+(level===3?' sentence':'');$('word').innerHTML=x.s.map(v=>`<span class="syl">${v}</span>`).join(level===3?' ':'');let opts=shuffle([x,...shuffle(levels[level].filter(y=>y.w!==x.w)).slice(0,3)]);$('choices').innerHTML=opts.map(o=>`<button class="choice" data-w="${o.w.replaceAll('"','&quot;')}">${o.w}</button>`).join('');[...document.querySelectorAll('.choice')].forEach(b=>b.onclick=()=>choose(b));$('msg').textContent='';$('bar').style.width=((index%levels[level].length+1)/levels[level].length*100)+'%';$('foot').textContent=`Karta ${index%levels[level].length+1} z ${levels[level].length}`}
function choose(b){if(answered)return;answered=true;const ok=b.dataset.w===item().w;b.classList.add(ok?'good':'bad');if(ok){score++;$('score').textContent=score;$('msg').textContent='Brawo, Marysiu! 🌟';$('word').classList.add('celebrate')}else{$('msg').textContent='Spróbuj jeszcze raz — dasz radę!';answered=false;setTimeout(()=>b.classList.remove('bad'),650)}}function next(){index++;render()}$('read').onclick=next;$('hear').onclick=()=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(item().w);u.lang='pl-PL';u.rate=.72;speechSynthesis.speak(u)};document.querySelectorAll('.level').forEach(b=>b.onclick=()=>{document.querySelector('.level.active').classList.remove('active');b.classList.add('active');level=+b.dataset.l;index=0;render()});render();
</script></body></html>
